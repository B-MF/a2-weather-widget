<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <script src="weather.js"></script>
</head>
<body>
    <div class="widget-container">
        <header>Location & Time</header>

        <img src="https://placeholder.com/100x100" alt="weather icon placeholder">
        <p>Weather Condition</p>
        <p>temperature C/F</p>

        <div class="day-card-container">
            <div>
                <p>Day</p>
                <img src="https://placeholder.com/25x25" alt="weather icon placeholder">
                <p>temperature C/F</p>
            </div>

        </div>


    </div>
    
</body>
</html>
