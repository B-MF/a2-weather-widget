<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <script src="weather.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="widget-container">
        <header>
            <h1>Location & Time</h1>
        </header>

        <img src="https://placeholder.com/100x100" alt="weather icon placeholder">
        <p>Weather Condition</p>
        <p id="current-temp">temperature C/F</p>
        <button>C&deg/F&deg</button>

        <div id="day-card-container">
            <div class="day-card">
                <p>Monday</p>
                <img src="https://placeholder.com/25x25" alt="weather icon placeholder">
                <p>20 C&deg</p>
            </div>
            <div class="day-card">
                <p>Tuesday</p>
                <img src="https://placeholder.com/25x25" alt="weather icon placeholder">
                <p>20 C&deg</p>
            </div>

        </div>


    </div>
    
</body>
</html>
